name: Validar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
      - name: Testar regras do rodízio
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6
      - name: Preparar arquivos públicos
        run: |
          mkdir _site
          cp index.html styles.css config.js ai-config.js app.js ai-client.js logic.js sheets-api.js robots.txt .nojekyll _site/
          cp -R assets _site/assets
      - name: Configurar Pages
        uses: actions/configure-pages@v6
      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
